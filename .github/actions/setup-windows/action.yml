name: Set up the Windows build
description: Install the Go and music frontend toolchains and restore their dependency caches.
runs:
  using: composite
  steps:
    - name: Set the Go build environment
      shell: pwsh
      run: |
        "GOCACHE=$(Join-Path $env:GITHUB_WORKSPACE 'build/go-cache')" >> $env:GITHUB_ENV
        'CGO_ENABLED=0' >> $env:GITHUB_ENV
    - uses: actions/setup-go@v6
      id: go
      with:
        go-version-file: go.mod
        cache: true
        cache-dependency-path: |
          go.mod
          go.sum
          .github/actions/setup-windows/action.yml
    - name: Populate the Go module cache
      if: steps.go.outputs.cache-hit != 'true'
      shell: pwsh
      run: go mod download
    - uses: actions/setup-node@v6
      with:
        node-version: '24'
        package-manager-cache: false
    - uses: pnpm/action-setup@v6
      with:
        version: '12.3.4'
        cache: true
        cache_dependency_path: web/music/pnpm-lock.yaml
