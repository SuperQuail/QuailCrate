name: QuailEgg PR
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - "main"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: qegg-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: "github.event.pull_request.head.repo.full_name != github.repository || github.head_ref != 'release'"
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v6
        with: { go-version-file: go.mod }
      - name: Install qegg
        run: go install github.com/SuperQuail/QuailEgg/cmd/qegg@v0.15.0
      - name: Check
        run: qegg check --ci
      - name: Preview
        id: preview
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          plan="$RUNNER_TEMP/plan.md"
          qegg plan --markdown > "$plan"
          if [ -s "$plan" ]; then
            echo "has_plan=true" >> "$GITHUB_OUTPUT"
          else
            echo "no pending release"
          fi

      - name: Upload release plan
        if: steps.preview.outputs.has_plan == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qegg-pr-plan-${{ github.run_attempt }}
          path: ${{ runner.temp }}/plan.md
          if-no-files-found: error
          retention-days: 3
