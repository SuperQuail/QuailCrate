name: Windows build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-windows
      - name: Build and test Windows packages
        run: pwsh -NoProfile -File scripts/verify-windows.ps1
      - name: Upload Windows packages
        uses: actions/upload-artifact@v7
        with:
          name: QuailCrate-windows-amd64
          path: |
            dist/QuailCrate-windows-amd64.zip
            dist/QuailCrate-windows-amd64-setup.exe
          if-no-files-found: error
          compression-level: 0
