schema_version = 1

[project]
repo = "github.com/SuperQuail/QuailCrate"
default_branch = "main"

[git]
remote = "origin"
tag_prefix = "v"

[release]
mode = "pr"
branch = "release"
github_release = true

[release.workflow]
mode = "managed"
runner = "windows-2022"
timeout_minutes = 60
yaml = '''
- name: Check release branch
  if: github.ref != 'refs/heads/main'
  shell: pwsh
  run: throw 'Run the release workflow from main.'
- uses: ./.github/actions/setup-windows
'''

[release.assets]
commands = ["pwsh -NoProfile -File scripts/verify-windows.ps1"]
files = ["dist/QuailCrate-windows-amd64.zip", "dist/QuailCrate-windows-amd64-setup.exe"]

[changes]
dir = ".changes"
scope = ["cmd", "internal", "pluginapi", "plugins", "web", "examples", "scripts", "go.mod", "go.sum"]

[verify]
commands = ["go mod verify", "pwsh -NoProfile -File scripts/build.ps1 -VerifyOnly"]
hook_commands = ["go mod verify"]
timeout = "30m"

[publish]
registries = []

[packages."go@quailcrate"]
name = "quailcrate"
path = "."
resolver = "go"
publish = false

